LABEL arch
TEXT HELP
Boot the Arch Linux install medium on BIOS.
ENDTEXT
MENU LABEL Arch Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram mitigations=off nosmt transparent_hugepage=always processor.max_cstate=1 amd_pstate=active nowatchdog nosoftlockup nmi_watchdog=0 audit=0 skew_tick=1 tsc=reliable numa_balancing=disable idle=poll rcu_nocbs=0-15 nohz_full=1-15 irqaffinity=0 noautogroup