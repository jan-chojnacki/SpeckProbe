[package]
name = "speck-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
indicatif = "0.18.4"
primitive-types = "0.14"
crossbeam = "0.8"
colored = "3"
console = "0.16"
num_cpus = "1.17"
textwrap = "0.16"
terminal_size = "0.4"
human_format = "1"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
toml = "1"
csv = "1"
walkdir = "2.5"
engine = { path = "../engine" }
rayon = "1.11"
seq-macro = "0.3.6"
paste = "1"
multiversion = "0.8"
strum = "0.28.0"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = "0.8"
rstest = "0.26"
bytemuck = { version = "1", features = ["avx512_simd", "aarch64_simd"] }